<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凤 · 光尘归器</title><style>
:root{--ink:#050507;--line:#343238;--muted:#77747d;--paper:#eae8e4}*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,'Noto Sans SC',sans-serif;overflow:hidden}body{height:100vh}.shell{height:100vh;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#13131a 0,#07070a 56%,#030305 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none}.grain{position:absolute;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.top{position:absolute;z-index:2;left:4vw;right:4vw;top:3vh;height:42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px;font-size:10px;letter-spacing:.14em}.mark{display:flex;align-items:center;gap:13px}.sig{width:23px;height:23px;border:1px solid #a9a5ad;border-radius:50%;display:grid;place-items:center;font-family:serif;font-size:14px}.micro{color:#85818a;font-size:9px;letter-spacing:.2em}.center-label{position:absolute;z-index:2;left:4vw;top:18vh}.kicker{font-size:10px;letter-spacing:.27em;color:#9c98a0}.title{font:400 clamp(34px,5vw,76px)/.95 Georgia,serif;margin:15px 0 12px;letter-spacing:.04em}.subtitle{font-size:11px;color:#9c98a0;letter-spacing:.2em}.right-label{position:absolute;z-index:2;right:4vw;top:18vh;text-align:right;font-size:10px;letter-spacing:.2em;line-height:2;color:#9b97a0}.right-label strong{color:#e7e3e7;font-weight:400}.bottom{position:absolute;z-index:2;left:4vw;right:4vw;bottom:4vh;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}.instruction{color:#99959d;font-size:10px;letter-spacing:.12em;line-height:1.7}.instruction b{display:block;color:#ddd9de;font-weight:400;margin-bottom:3px}.meta{text-align:right;color:#6e6b73;font:9px/1.8 monospace;letter-spacing:.1em}.mode{position:absolute;z-index:2;right:4vw;bottom:17vh;border:1px solid #3e3b43;color:#aaa6ad;padding:9px 12px;font-size:9px;letter-spacing:.18em;transition:.25s}.mode.active{color:#f0edf1;border-color:#bdb8c3;box-shadow:0 0 20px #fff2}.cursor{position:fixed;z-index:4;width:14px;height:14px;border:1px solid #eee;border-radius:50%;pointer-events:none;mix-blend-mode:difference;transform:translate(-50%,-50%);transition:width .2s,height .2s}.pulse{position:absolute;z-index:3;left:50%;top:50%;width:0;height:0;border:1px solid #fff;border-radius:50%;opacity:0;transform:translate(-50%,-50%);pointer-events:none}.pulse.go{animation:pulse .8s ease-out}@keyframes pulse{0%{width:8px;height:8px;opacity:.8}100%{width:440px;height:440px;opacity:0}}@media(pointer:coarse){.cursor{display:none}.instruction b:after{content:' · 点击切换形态'}}
</style></head><body><main class="shell"><canvas id="c"></canvas><div class="grain"></div><header class="top"><div class="mark"><span class="sig">凤</span><span>ARCHIVE / 002</span></div><span class="micro">FORM · LIGHT · MOTION</span></header><section class="center-label"><div class="kicker">INTERACTIVE SPECIMEN</div><h1 class="title">凤 · 光尘归器</h1><div class="subtitle">A STUDY IN AZURE AND GOLD</div></section><aside class="right-label"><strong>粒子形态 / 01</strong><br>鼠标穿过粒子场<br>观察形体回响</aside><div class="mode" id="mode">FIELD / READY</div><footer class="bottom"><div class="instruction"><b>移动指针，扰动粒子场</b>点击画布聚合 / 散开 · 按住 SHIFT 进入引力模式</div><div class="meta">LOCAL CANVAS STUDY<br>1055 × 1491 / PHOENIX</div></footer><div class="cursor" id="cursor"></div><div class="pulse" id="pulse"></div></main><script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d'),cursor=document.querySelector('#cursor'),mode=document.querySelector('#mode'),pulse=document.querySelector('#pulse');let W,H,dpr,pts=[],mouse={x:innerWidth/2,y:innerHeight/2,active:false},goal=0,energy=0,shift=false;const img=new Image();img.src='assets/phoenix.png';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);sample()}function sample(){if(!img.naturalWidth)return;const s=Math.min(W*.52/img.naturalWidth,H*.7/img.naturalHeight),iw=Math.floor(img.naturalWidth*s),ih=Math.floor(img.naturalHeight*s),ox=(W-iw)/2,oy=(H-ih)/2,t=document.createElement('canvas'),tc=t.getContext('2d');t.width=iw;t.height=ih;tc.drawImage(img,0,0,iw,ih);const d=tc.getImageData(0,0,iw,ih).data;pts=[];const step=Math.max(2,Math.floor(Math.sqrt(iw*ih/9000)));for(let y=0;y<ih;y+=step)for(let x=0;x<iw;x+=step){const i=(y*iw+x)*4;if(d[i+3]<40||d[i]+d[i+1]+d[i+2]>735)continue;pts.push({ox:ox+x,oy:oy+y,x:ox+x,y:oy+y,px:ox+x,py:oy+y,r:d[i]/255,g:d[i+1]/255,b:d[i+2]/255,a:d[i+3]/255,v:Math.random()*6.28,seed:Math.random()})}}
function tick(t){requestAnimationFrame(tick);ctx.fillStyle='rgba(4,4,7,.28)';ctx.fillRect(0,0,W,H);const spread=goal;energy*=.985;ctx.save();ctx.globalCompositeOperation='lighter';for(const p of pts){const dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy)||1;let ax=0,ay=0;if(mouse.active&&dist<240){const force=(1-dist/240)*(shift?-1:1)*(shift?2.7:1.1);ax=dx/dist*force;ay=dy/dist*force}const swirl=Math.sin(t*.001+p.v)*.18;const tx=p.ox+Math.cos(p.v+t*.00025)*spread*(25+p.seed*80)+ax*34,ty=p.oy+Math.sin(p.v+t*.00025)*spread*(25+p.seed*80)+ay*34;p.x+=(tx-p.x)*.075+ax; p.y+=(ty-p.y)*.075+ay;p.px+=(p.x-p.px)*.35;p.py+=(p.y-p.py)*.35;const pulse=.55+.45*Math.sin(t*.003+p.v);ctx.globalAlpha=.28+p.a*.62;ctx.strokeStyle=`rgb(${70+p.r*180|0},${90+p.g*150|0},${130+p.b*120|0})`;ctx.lineWidth=.5+1.4*p.seed;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.shadowBlur=energy*12+5;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,(.55+p.seed*1.35)*pulse,0,6.283);ctx.fill()}ctx.restore();ctx.shadowBlur=0}img.onload=()=>{resize();requestAnimationFrame(tick)};addEventListener('resize',resize);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});addEventListener('mouseleave',()=>mouse.active=false);addEventListener('keydown',e=>{shift=e.key==='Shift';if(e.code==='Space'){goal=goal?0:1;energy=1;mode.textContent=goal?'FORM / RELEASE':'FIELD / READY';mode.classList.toggle('active',!!goal)}});addEventListener('keyup',e=>{if(e.key==='Shift')shift=false});cv.addEventListener('click',()=>{goal=goal?0:1;energy=1;mode.textContent=goal?'FORM / RELEASE':'FIELD / READY';mode.classList.toggle('active',!!goal);pulse.classList.remove('go');void pulse.offsetWidth;pulse.classList.add('go')});</script></body></html>
